name: Scan and publish phone site

# Runs the same scan as the desktop app on GitHub's servers a few times a day
# (about 8:15, 12:15 and 4:15 pm Central) and refreshes the phone site.
# "Run workflow" on the Actions tab starts one immediately.
on:
  schedule:
    - cron: '15 13,17,21 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scan-and-publish
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: America/Chicago
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-cloud.txt

      - run: pip install -r requirements-cloud.txt

      # Exits with an error (and publishes nothing) if the scan is incomplete,
      # so a bad run never replaces the last good snapshot.
      - name: Scan and build the phone site
        run: python build_site_cli.py --out site --repo-url "https://github.com/${{ github.repository }}"

      - name: Publish to the gh-pages branch
        run: |
          cd site
          git init -q -b gh-pages
          git config user.name "TrendScout bot"
          git config user.email "trendscout-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "Snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
